name: "CodeQL"

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  schedule:
    - cron: "29 5 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # Mirrors the languages the (now-disabled) CodeQL default setup
        # covered for code that actually exists in the repo: GitHub Actions
        # workflows, JS/TS, and Rust. Python is intentionally omitted — the
        # repo contains no Python source (default setup's python leg only
        # ever produced a "no source code seen" configuration error).
        language: ["actions", "javascript-typescript", "rust"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
